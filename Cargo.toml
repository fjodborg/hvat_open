[workspace]
members = ["hvat_leptos", "hvat_gpu", "hvat_axum"]
resolver = "2"

# Workspace-level dependencies for version consistency
[workspace.dependencies]
# Leptos ecosystem
leptos = { version = "0.8", features = ["csr"] }
thaw = "0.4"
leptos-use = "0.17"
leptos_hotkeys = "0.2"

# WebGPU
wgpu = "27"

# Web platform
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = "0.3"

# Core utilities
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"

# Image processing
image = "0.25"
ndarray = "0.17"
ndarray-npy = { version = "0.10", default-features = false }

# Production release: fully optimized, small binary (slowest to compile)
# Build with: cargo build --release
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"

# Fast release build: good optimizations, faster compile times
# Build with: cargo build --profile release-dev
[profile.release-dev]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
strip = "symbols"
panic = "unwind"

# Release with debug symbols for profiling (function names in browser DevTools)
# Build with: cargo build --profile release-debug
[profile.release-debug]
inherits = "release"
opt-level = 2
debug = true
strip = "none"
lto = false
codegen-units = 16
panic = "unwind"

[profile.dev]
# debug = true is already the default

[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code = "forbid"
elided_lifetimes_in_paths = "warn"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "warn", priority = -1 }
rust_2018_idioms = { level = "warn", priority = -1 }
rust_2021_prelude_collisions = "warn"
semicolon_in_expressions_from_macros = "warn"
trivial_numeric_casts = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_extern_crates = "warn"
unused_import_braces = "warn"
unused_lifetimes = "warn"
trivial_casts = "allow"
unused_qualifications = "allow"

[workspace.lints.rustdoc]
all = "warn"
missing_crate_level_docs = "warn"

[workspace.lints.clippy]
all = "warn"
