[package]
name = "hvat_backend"
version = "0.1.0"
edition = "2024"
default-run = "hvat_backend"
license = "AGPL-3.0"
authors = ["fjodborg <github.com/fjodborg>"]
description = "HVAT API server for hyperspectral image streaming and annotation sync"

[[bin]]
name = "hvat_backend"
path = "src/full_sam/main.rs"

[[bin]]
name = "simple"
path = "src/simple/main.rs"

[features]
default = []
sam-cuda = ["ort/cuda"]

[dependencies]
# Shared utilities
hvat_common = { path = "../hvat_common" }

# Web framework
axum = { version = "0.8", features = ["macros", "multipart", "ws"] }
axum-extra = { version = "0.10", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
tower = { version = "0.5", features = ["util", "timeout"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Async utilities
futures = "0.3"

# Image processing (from workspace)
image = { workspace = true }
ndarray = { workspace = true }
ndarray-npy = { workspace = true }

# Caching
lru = "0.12"

# ONNX Runtime for SAM inference
ort = "2.0.0-rc.10"

# Parallel processing
rayon = "1.10"

# Utilities
uuid = { version = "1", features = ["v4", "serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = { workspace = true }
anyhow = "1"
byteorder = "1"
async-trait = "0.1"
clap = { version = "4", features = ["derive", "env"] }
zip = "2"

# HTTP client for model download
reqwest = { version = "0.12", features = ["json"] }

# Logging
log = { workspace = true }

[dev-dependencies]
tokio-tungstenite = "0.26"
futures-util = "0.3"
tempfile = "3"

[lints]
workspace = true
