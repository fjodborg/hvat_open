# Enable bulk memory operations for WASM (required for panic=unwind)
[target.wasm32-unknown-unknown]
rustflags = ["-C", "target-feature=+bulk-memory"]

# Avoid using all my resources when doing other things at the same time
[build]
jobs = 4

# Limit test threads to avoid RAM exhaustion (each visual test spawns Chrome + warp server)
# With the lightweight warp static file server, we can now run tests in parallel.
[env]
RUST_TEST_THREADS = "4"

# Cargo aliases for common commands
[alias]
# Run hvat_axum server with release-dev profile (fast compile, good perf)
serve = "run --profile release-dev -p hvat_axum -- --data-dir hvat_visual_tests/test_input"
# Run hvat_axum with SAM enabled
serve-sam = "run --profile release-dev -p hvat_axum --features sam-cuda -- --data-dir hvat_visual_tests/test_input --sam-enabled --sam-variant tiny"
# Run hvat_axum in debug mode
serve-debug = "run -p hvat_axum -- --data-dir hvat_visual_tests/test_input"
# Run hvat_axum with short ping intervals for testing keepalive
serve-test-keepalive = "run --profile release-dev -p hvat_axum -- --data-dir hvat_visual_tests/test_input --ping-interval 5 --connection-timeout 15 --max-connections 3"
